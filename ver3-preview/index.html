:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#244463;background:#e8f7ff}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}.app{max-width:540px;margin:auto;padding:12px 12px max(18px,env(safe-area-inset-bottom));text-align:center}h1{font-size:clamp(24px,6vw,31px);margin:4px 0}p{margin:5px 0 10px;font-size:14px}.panel{background:white;border-radius:20px;padding:12px;box-shadow:0 5px 18px #5d91b321}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}button{touch-action:manipulation;cursor:pointer;font:inherit;border:0;border-radius:15px;font-weight:800;min-height:48px;padding:8px;background:#e9eff8;color:#244463}button:focus-visible{outline:3px solid #266bd0;outline-offset:2px}.chosen{background:#2576d9;color:#fff}.play{width:100%;background:#21a866;color:white;font-size:19px;margin:4px 0 10px}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin:5px 0 10px}.stats span{background:#f0f8ff;border-radius:10px;flex:1;padding:7px}canvas{display:block;width:100%;aspect-ratio:1;border:5px solid #76c99b;border-radius:14px;background:#e6f7db;touch-action:none}.msg{font-weight:800;min-height:27px;margin:10px 0 2px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:290px;margin:10px auto 0}.pad button{background:#ffdf77;font-size:25px;min-height:54px}.pad .none{visibility:hidden}.tiny{color:#596b7b;font-size:12px;line-height:1.5;margin-top:8px}.pause{background:#e9eff8}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-height:740px){.pad button{min-height:45px}.app{padding-top:5px}.panel{padding:9px}h1{margin:0;font-size:24px}.choices{margin:6px 0}}

/* Ver.3: 6 train choices, friendly iPhone layout */
.train-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 10px}
.train-choices button{min-height:70px;padding:6px 2px;border:2px solid #dae5ed;background:#f7fbff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;line-height:1.2}

.train-pic::before{content:'';position:absolute;top:4px;left:9px;width:18px;height:7px;background:#16517a;border-radius:7px;box-shadow:23px 0 0 -1px #64a7ca}
.train-pic::after{content:'';position:absolute;bottom:3px;left:5px;right:4px;height:4px;border-radius:3px;background:var(--stripe)}
.train-pic.local,.train-pic.sl{border-radius:5px}

@media(max-height:750px){.train-choices button{min-height:61px}.pad button{min-height:46px}}

:root{color:#153d69;background:#b7e9ff}
body{background:radial-gradient(circle at 85% 8%,#fff9 0 5%,transparent 5.2%),radial-gradient(circle at 10% 16%,#ffffffbb 0 7%,transparent 7.2%),linear-gradient(180deg,#45b8ff 0%,#b8edff 34%,#e7faff 58%,#b8e889 100%);min-height:100vh}

h1{font-size:clamp(27px,7vw,35px);line-height:1.18;letter-spacing:-.04em;color:white;text-shadow:0 3px 0 #125baf,0 6px 10px #1d529f88;-webkit-text-stroke:.6px #186cce;margin:5px 0 4px}

.panel{border:3px solid #fff;border-radius:26px;padding:13px;background:linear-gradient(160deg,#f2fbff 0%,#fff 30%,#eaf8ff 100%);box-shadow:0 0 0 3px #2793eb,0 12px 28px #0061b048}
.choices{padding:4px;background:#bfe9ff;border-radius:16px;margin:0 0 11px}
.choices button{border:2px solid white;box-shadow:0 3px 0 #77b7e3;min-height:47px}

.train-choices{gap:8px;margin:0 0 12px}
.train-choices button{min-height:98px;padding:8px 2px 7px;border:3px solid #bcdcef;background:linear-gradient(180deg,#eafaff,#fff);border-radius:16px;box-shadow:0 4px 0 #a4c9de;gap:7px;color:#123e68}
.train-choices button.chosen{border:3px solid #ffd42c;background:linear-gradient(#f9fdff,#d4efff);box-shadow:0 0 0 2px #f3a917,0 5px 0 #b88a13;color:#0a4b8a}
.train-pic{transform:scale(1.13);width:66px;height:29px;border-radius:18px 6px 6px 18px;box-shadow:0 5px 0 #4a6e8d26, inset 0 3px 0 #ffffffbb}
.train-pic.local,.train-pic.sl{border-radius:7px}
.train-pic::before{top:4px;left:10px;width:21px;height:8px;box-shadow:25px 0 0 -1px #64a7ca;background:linear-gradient(#0a3c68,#46a6dc)}

.pad button{background:linear-gradient(#45adff,#0c6ad5);color:white;border:3px solid white;border-radius:20px;box-shadow:0 4px 0 #0755a0,0 0 0 2px #8cccff;text-shadow:0 2px #0755a0;min-height:59px;font-size:28px}

</style></head><body><main class="app"><h1>🚄 でんしゃスネーク</h1><p>⭐をあつめて れっしゃをながくしよう！</p><section class="panel"><div class="choices"><button type="button" id="easy" class="chosen">🌼 やさしい</button><button type="button" id="normal">🔥 ふつう</button></div><div class="train-choices" id="trainChoices" aria-label="でんしゃをえらぶ">
<button type="button" data-skin="bullet" class="chosen" aria-pressed="true"><span class="train-pic" style="--body:#ffffff;--stripe:#2779da"></span><span class="train-name">しんかんせん</span></button>
<button type="button" data-skin="local" aria-pressed="false"><span class="train-pic local" style="--body:#ffcf67;--stripe:#ed7130"></span><span class="train-name">でんしゃ</span></button>
<button type="button" data-skin="doctor" aria-pressed="false"><span class="train-pic" style="--body:#ffe32b;--stripe:#2776cf"></span><span class="train-name">ドクターイエロー</span></button>
<button type="button" data-skin="hayabusa" aria-pressed="false"><span class="train-pic" style="--body:#1bb690;--stripe:#f15da2"></span><span class="train-name">はやぶさ</span></button>
<button type="button" data-skin="komachi" aria-pressed="false"><span class="train-pic" style="--body:#eb383c;--stripe:#ffffff"></span><span class="train-name">こまち</span></button>
<button type="button" data-skin="sl" aria-pressed="false"><span class="train-pic sl" style="--body:#303943;--stripe:#9e6f36"></span><span class="train-name">SL</span></button>
</div><div class="row"><button type="button" id="start" class="play">▶ あそぶ！</button><button type="button" id="pause" class="pause">⏸ とめる</button></div><div class="stats"><span>⭐ <b id="score">0</b> こ</span><span>🏆 <b id="best">0</b> こ</span></div><canvas id="board" width="420" height="420" aria-label="でんしゃのゲーム盤"></canvas><div class="msg" id="msg" aria-live="polite">「あそぶ！」をおしてね</div><div class="pad"><div class="none"></div><button type="button" data-dir="up" aria-label="うえ">▲</button><div class="none"></div><button type="button" data-dir="left" aria-label="ひだり">◀</button><button type="button" data-dir="down" aria-label="した">▼</button><button type="button" data-dir="right" aria-label="みぎ">▶</button></div><div class="tiny">Ver.3 · 14×14 マス　|　がめんをスワイプしても うごかせるよ。<br>やさしい：ぶつかってもおわらない ／ ふつう：ぶつかるとおわり</div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');const N=14,C=420/N;let mode='easy',skin='bullet',snake=[],food=null,dir='right',queued='right',score=0,best=0,active=false,paused=false,dead=false,timer=null,locked=false;try{best=Number(localStorage.getItem('densha-best')||0)||0}catch{}$('best').textContent=best;
function select(group,val){if(group==='mode'){mode=val;$('easy').classList.toggle('chosen',val==='easy');$('normal').classList.toggle('chosen',val==='normal');if(active){clearInterval(timer);timer=setInterval(tick,mode==='easy'?320:190)}}else{skin=val;document.querySelectorAll('[data-skin]').forEach(b=>{const on=b.dataset.skin===val;b.classList.toggle('chosen',on);b.setAttribute('aria-pressed',String(on))})}draw()}
$('easy').onclick=()=>select('mode','easy');$('normal').onclick=()=>select('mode','normal');document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>select('skin',b.dataset.skin));
function start(){clearInterval(timer);snake=[{x:3,y:7},{x:2,y:7},{x:1,y:7}];dir=queued='right';score=0;$('score').textContent=0;active=true;paused=false;dead=false;locked=false;placeFood();$('msg').textContent='⭐を とりにいこう！';$('pause').textContent='⏸ とめる';timer=setInterval(tick,mode==='easy'?320:190);draw()}
$('start').onclick=start;$('pause').onclick=()=>{if(!active)return;paused=!paused;$('pause').textContent=paused?'▶ つづける':'⏸ とめる';$('msg').textContent=paused?'おやすみちゅう':'しゅっぱつ！';draw()};
function placeFood(){const empties=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))empties.push({x,y});food=empties.length?empties[Math.floor(Math.random()*empties.length)]:null;if(!food){active=false;clearInterval(timer);$('msg').textContent='ぜんぶつながった！ おめでとう！'}}
const reverse={left:'right',right:'left',up:'down',down:'up'};function turn(d){if(!active||paused||locked||reverse[dir]===d)return;queued=d;locked=true}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>turn(b.dataset.dir));document.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();turn(d)}});
let tx=0,ty=0;canvas.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-tx,dy=e.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
function tick(){if(!active||paused)return;dir=queued;locked=false;const h={...snake[0]};if(dir==='up')h.y--;if(dir==='down')h.y++;if(dir==='left')h.x--;if(dir==='right')h.x++;if(mode==='easy'){h.x=(h.x+N)%N;h.y=(h.y+N)%N}else if(h.x<0||h.x>=N||h.y<0||h.y>=N){finish();return}let eats=food&&h.x===food.x&&h.y===food.y;const body=snake.slice(0,eats?snake.length:snake.length-1);const hit=body.some(p=>p.x===h.x&&p.y===h.y);if(hit&&mode==='normal'){finish();return}if(hit&&mode==='easy'){// やさしいモードでは重ならず、空いている場所へ一時移動する
 const candidates=[{x:(h.x+1)%N,y:h.y},{x:h.x,y:(h.y+1)%N},{x:(h.x+N-1)%N,y:h.y},{x:h.x,y:(h.y+N-1)%N}];const spare=candidates.find(p=>!body.some(s=>s.x===p.x&&s.y===p.y));if(spare){h.x=spare.x;h.y=spare.y;eats=food&&h.x===food.x&&h.y===food.y}else{draw();return}}
 snake.unshift(h);if(eats){score++;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('densha-best',String(best))}catch{}}sound();$('msg').textContent='やったー！ 1りょう ふえた！';placeFood()}else snake.pop();draw()}
function finish(){active=false;dead=true;clearInterval(timer);$('msg').textContent='おしまい！ もういちど あそぼう！';draw()}
function sound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(580,ac.currentTime);o.frequency.linearRampToValueAtTime(900,ac.currentTime+.12);g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);o.onended=()=>ac.close()}catch{}}
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r)}else{const q=Math.min(r,w/2,h/2);ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath()}ctx.fill()}
const paint={
 bullet:{body:'#fafdff',line:'#2479d1',window:'#285d8d',edge:'#9fb1c2',nose:'#fafdff',kind:'bullet'},
 local:{body:'#ffcb65',line:'#f17832',window:'#3b91b5',edge:'#bd793c',nose:'#ffcf65',kind:'local'},
 doctor:{body:'#ffe535',line:'#2478c5',window:'#2d6b93',edge:'#d7ab2a',nose:'#ffe535',kind:'bullet'},
 hayabusa:{body:'#13b394',line:'#e65a9b',window:'#154c72',edge:'#087860',nose:'#13b394',kind:'bullet'},
 komachi:{body:'#ef4146',line:'#f9fbff',window:'#235075',edge:'#ad2934',nose:'#ef4146',kind:'bullet'},
 sl:{body:'#303b45',line:'#b48345',window:'#536579',edge:'#111b25',nose:'#303b45',kind:'sl'}
};
function directionTo(from,to){if(!to)return null;let dx=to.x-from.x,dy=to.y-from.y;
 // Avoid treating wraparound segments as a line across the board.
 if(Math.abs(dx)>1)dx=-Math.sign(dx);if(Math.abs(dy)>1)dy=-Math.sign(dy);
 if(dx>0)return 'right';if(dx<0)return 'left';if(dy>0)return 'down';if(dy<0)return 'up';return null}
function segmentHeading(i){if(i===0)return dir;return directionTo(snake[i],snake[i-1])||dir}
function drawCarFront(p){
 if(p.kind==='sl'){
   rr(-13,-11,25,22,4,'#20272f');rr(-11,-9,21,18,3,p.body);
   rr(-7,-5,9,10,2,p.window);rr(7,-6,3,13,1,'#c49450');
   rr(-11,7,22,4,2,'#986b37');
   rr(0,-14,8,7,1,'#20272f');rr(1,-16,6,3,1,'#151b22');
   ctx.fillStyle='#f9db69';ctx.beginPath();ctx.arc(10,0,3.5,0,2*Math.PI);ctx.fill();
 }else if(p.kind==='local'){
   rr(-13,-12,26,24,5,p.edge);rr(-12,-11,24,22,4,p.body);
   rr(0,-9,10,18,3,p.window);rr(-11,-8,8,7,2,'#91d4ed');
   rr(-12,6,24,5,2,p.line);rr(10,-7,2,4,1,'#ffffa6');
 }else{
   // Compact tapered bullet train nose, pointing right.
   ctx.fillStyle=p.edge;ctx.beginPath();ctx.moveTo(-13,-11);ctx.lineTo(2,-11);
   ctx.bezierCurveTo(13,-10,15,-4,15,0);ctx.bezierCurveTo(15,4,13,10,2,11);
   ctx.lineTo(-13,11);ctx.closePath();ctx.fill();
   ctx.fillStyle=p.nose;ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(1,-10);
   ctx.bezierCurveTo(12,-9,14,-4,14,0);ctx.bezierCurveTo(14,4,12,9,1,10);
   ctx.lineTo(-12,10);ctx.closePath();ctx.fill();
   rr(-10,-7,12,7,4,p.window);
   rr(-12,4,23,3,2,p.line);
   if(skin==='hayabusa')rr(-12,8,17,2,1,'#f6fafc');
   if(skin==='komachi')rr(-12,7,21,2,1,'#f8fafc');
 }
}
function drawCarMiddle(p,isTail){
 if(p.kind==='sl'){
   rr(-13,-11,26,22,4,'#1e242c');rr(-11,-9,22,18,3,isTail?'#765032':'#825532');
   rr(-9,-6,7,8,2,'#7bc3dc');rr(1,-6,7,8,2,'#7bc3dc');
   rr(-11,5,23,3,1,'#a67538');
   ctx.fillStyle='#18222b';ctx.beginPath();ctx.arc(-7,11,3,0,7);ctx.arc(7,11,3,0,7);ctx.fill();
 }else{
   rr(-13,-12,26,24,5,p.edge);rr(-12,-11,24,22,4,p.body);
   rr(-11,3,22,4,2,p.line);
   rr(-9,-7,7,7,2,p.window);rr(2,-7,7,7,2,p.window);
   if(isTail)rr(-11,-2,2,4,1,'#ffe89e');
 }
}
function drawTrain(s,i){const heading=segmentHeading(i),angle={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[heading]||0;
 ctx.save();ctx.translate((s.x+.5)*C,(s.y+.5)*C);ctx.rotate(angle);
 const p=paint[skin]||paint.bullet;
 // Soft shadow and coupling point.
 rr(-13,10,26,3,2,'#00000017');
 rr(-15,-3,4,6,2,p.edge);
 if(i===0)drawCarFront(p);else drawCarMiddle(p,i===snake.length-1);
 ctx.restore()}
function drawConnections(){ctx.save();ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle=(paint[skin]||paint.bullet).edge;
 for(let i=1;i<snake.length;i++){const a=snake[i],b=snake[i-1];if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1)continue;
 ctx.beginPath();ctx.moveTo((a.x+.5)*C,(a.y+.5)*C);ctx.lineTo((b.x+.5)*C,(b.y+.5)*C);ctx.stroke()}ctx.restore()}
function draw(){ctx.fillStyle='#a4e48b';ctx.fillRect(0,0,420,420);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if((x+y)%2===0){ctx.fillStyle='#b0eb98';ctx.fillRect(x*C,y*C,C,C)}ctx.strokeStyle='#8ad077';ctx.lineWidth=.6;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,420);ctx.moveTo(0,i*C);ctx.lineTo(420,i*C);ctx.stroke()}if(food){const x=(food.x+.5)*C,y=(food.y+.5)*C;ctx.fillStyle='#fff9bb';ctx.beginPath();ctx.arc(x,y,14,0,2*Math.PI);ctx.fill();ctx.font='25px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⭐',x,y+1)}drawConnections();for(let i=snake.length-1;i>=0;i--)drawTrain(snake[i],i);if(!active){ctx.fillStyle='rgba(255,255,255,.70)';ctx.fillRect(0,0,420,420);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#244463';ctx.font='bold 28px sans-serif';ctx.fillText(dead?'もういっかい！':'🚄 しゅっぱつ！',210,205)}else if(paused){ctx.fillStyle='#ffffffa8';ctx.fillRect(0,0,420,420);ctx.fillStyle='#244463';ctx.textAlign='center';ctx.font='bold 28px sans-serif';ctx.fillText('おやすみちゅう',210,210)}}// Increase canvas backing resolution without changing the game coordinates.
const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1));
canvas.width=Math.round(420*dpr);canvas.height=Math.round(420*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);draw();
})();</script></body></html>
